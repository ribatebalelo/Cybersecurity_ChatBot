name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore CybersecurityChatBot.csproj

    - name: Build
      run: dotnet build CybersecurityChatBot.csproj --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish
      run: dotnet publish CybersecurityChatBot.csproj --configuration ${{ matrix.configuration }} --no-build --output publish/${{ matrix.configuration }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: CybersecurityChatBot-${{ matrix.configuration }}
        path: publish/${{ matrix.configuration }}
